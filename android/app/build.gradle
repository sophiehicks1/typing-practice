plugins {
    id 'com.android.application'
}

// Monotonic version derived from the CI run number, so each published APK has a
// higher versionCode than the last (Android requires this to update in place).
// Falls back to 1 for local builds.
def ciRunNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'live.hicks.typingpractice'
    compileSdk 34

    defaultConfig {
        applicationId 'live.hicks.typingpractice'
        // API 26 (Android 8.0) keeps the icon setup simple (adaptive icons only)
        // and covers the overwhelming majority of active devices.
        minSdk 26
        targetSdk 34
        versionCode ciRunNumber
        versionName "1.0.${ciRunNumber}"
    }

    signingConfigs {
        // A committed, stable debug keystore (password is the well-known
        // "android"). It is NOT a secret -- it only produces debug-signed APKs
        // for sideloading. Committing it means every release is signed with the
        // same certificate, so installs can update in place instead of Gradle
        // minting a fresh throwaway key on each CI runner.
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // No shrinking: the app is a single Activity plus a bundled HTML
            // asset, so there is nothing to strip.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: WebView ships with the Android framework, and the
// app uses the plain android.app.Activity, so nothing extra is needed.
dependencies {
}
